<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учитель — Тренажёр дроби</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Панель учителя</h1>
            <div class="auth-block">
                <a href="/app" class="auth-btn">На тренажёр</a>
            </div>
        </header>
        <p id="auth-required" class="hidden">Войдите как учитель или администратор.</p>
        <section id="teacher-content" class="hidden">
            <h2>По классам</h2>
            <div id="by-class-container"></div>
            <h2>Все ученики</h2>
            <ul id="students-list"></ul>
            <h3>Детали ученика</h3>
            <div id="student-detail" class="hidden">
                <p id="detail-name"></p>
                <p id="detail-school-class"></p>
                <p id="detail-gamification"></p>
                <p id="detail-errors"></p>
                <ul id="detail-topics"></ul>
                <p><strong>Последние попытки</strong></p>
                <ul id="detail-attempts"></ul>
            </div>
        </section>
    </div>
    <script>
        fetch('/api/me').then(r => r.json()).then(data => {
            const user = data.user;
            if (!user || (user.role !== 'teacher' && user.role !== 'admin')) {
                document.getElementById('auth-required').classList.remove('hidden');
                return;
            }
            document.getElementById('teacher-content').classList.remove('hidden');
            return fetch('/api/teacher/students');
        }).then(r => r && r.json()).then(data => {
            if (!data || !data.students) return;
            const byClass = data.by_class || {};
            const classContainer = document.getElementById('by-class-container');
            classContainer.innerHTML = '';
            Object.keys(byClass).sort().forEach(cls => {
                const section = document.createElement('div');
                section.className = 'teacher-class-section';
                const title = document.createElement('h4');
                title.textContent = 'Класс: ' + cls;
                section.appendChild(title);
                const ul = document.createElement('ul');
                ul.className = 'students-by-class';
                (byClass[cls] || []).forEach(s => {
                    const li = document.createElement('li');
                    li.innerHTML = '<strong>' + escapeHtml(s.name || s.email) + '</strong> — ⭐ ' + s.total_stars + ' | 🔥 ' + s.current_streak + ' | тем: ' + s.progress_summary.length;
                    li.style.cursor = 'pointer';
                    li.onclick = () => loadStudentDetail(s.id);
                    ul.appendChild(li);
                });
                section.appendChild(ul);
                classContainer.appendChild(section);
            });
            const ul = document.getElementById('students-list');
            ul.innerHTML = '';
            data.students.forEach(s => {
                const li = document.createElement('li');
                li.innerHTML = '<strong>' + escapeHtml(s.name || s.email) + '</strong>' + (s.school_class ? ' (' + escapeHtml(s.school_class) + ')' : '') + ' — ⭐ ' + s.total_stars + ' | 🔥 ' + s.current_streak + ' | тем: ' + s.progress_summary.length;
                li.style.cursor = 'pointer';
                li.onclick = () => loadStudentDetail(s.id);
                ul.appendChild(li);
            });
        }).catch(() => {});

        function escapeHtml(s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        function loadStudentDetail(id) {
            fetch('/api/teacher/students/' + id).then(r => r.json()).then(data => {
                const d = document.getElementById('student-detail');
                d.classList.remove('hidden');
                document.getElementById('detail-name').textContent = 'Ученик: ' + (data.student.name || data.student.email);
                const sc = [data.student.school, data.student.school_class].filter(Boolean).join(', ');
                document.getElementById('detail-school-class').textContent = sc ? 'Школа, класс: ' + sc : '';
                const g = data.gamification;
                document.getElementById('detail-gamification').textContent = `⭐ ${g.total_stars} | Серия: ${g.current_streak} | Лучшая: ${g.best_streak} | ${g.status_name} | Сундуков: ${g.chests_available}`;
                const errRu = data.error_type_counts_ru || {};
                document.getElementById('detail-errors').textContent = 'Типы ошибок: ' + (Object.keys(errRu).length ? Object.entries(errRu).map(([name, cnt]) => name + ': ' + cnt).join('; ') : 'нет данных');
                const tUl = document.getElementById('detail-topics');
                tUl.innerHTML = '';
                (data.topics_progress || []).forEach(t => {
                    const li = document.createElement('li');
                    li.textContent = (t.name || t.operation) + ': ' + t.progress_pct + '%';
                    tUl.appendChild(li);
                });
                const aUl = document.getElementById('detail-attempts');
                aUl.innerHTML = '';
                (data.recent_attempts || []).forEach(a => {
                    const li = document.createElement('li');
                    const dateStr = a.created_at ? new Date(a.created_at).toLocaleString('ru-RU') : '';
                    const op = a.operation_ru || a.operation;
                    const result = a.is_correct ? '✓ Верно' : '✗ Ошибка' + (a.error_type_ru ? ': ' + a.error_type_ru : '');
                    li.textContent = op + ' — ' + result + ' (' + dateStr + ')';
                    aUl.appendChild(li);
                });
            });
        }
    </script>
</body>
</html>
