# Деплой на Render.com (бесплатный тариф)
# Подключите репозиторий GitHub в Render → New Web Service → укажите репозиторий.
# Build Command: pip install -r requirements.txt
# Start Command: gunicorn server:app -b 0.0.0.0:$PORT
# В Render Dashboard → Environment задайте SECRET_KEY вручную (случайная строка).
# DATABASE_URL подставляется автоматически из matema-db (Internal connection string).
# В Render Dashboard → Settings → Health Check Path укажите /health — проверка без обращения к БД.

databases:
  - name: matema-db
    plan: free
    region: oregon
    version: "16"

services:
  - type: web
    name: matema
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app -b 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: matema-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
