# Деплой на Render.com (бесплатный тариф)
# Подключите репозиторий GitHub в Render → New Web Service → укажите репозиторий.
# Build Command: pip install -r requirements.txt
# Start Command: gunicorn server:app
# ВАЖНО: В Render Dashboard → Environment задайте SECRET_KEY вручную (случайная строка с https://randomkeygen.com/).
# Не используйте generateValue — иначе после каждого деплоя сессии сбрасываются и возникает ошибка проверки.
# В Render Dashboard → Environment задайте SECRET_KEY и DATABASE_URL (Internal Database URL вашего Postgres).

services:
  - type: web
    name: matema
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
